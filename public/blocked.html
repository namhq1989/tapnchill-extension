<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked</title>
  <style>
      /* General styles */
      body {
          margin: 0;
          font-family: Arial, sans-serif;
          background-color: #f3f4f6;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          color: #333;
      }

      /* Card container */
      .card {
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          text-align: center;
          max-width: 400px;
          width: 100%;
      }

      /* Icon styles */
      .icon {
          color: #ef4444;
          margin-bottom: 1rem;
      }

      .icon svg {
          width: 100px; /* Adjusted icon width */
          height: 100px; /* Adjusted icon height */
      }

      /* Title and description */
      .title {
          font-size: 1.5rem;
          font-weight: bold;
          margin-bottom: 0.5rem;
      }

      .description {
          color: #666;
          font-size: 1rem;
          margin-bottom: 1.5rem;
      }

      /* Button styles */
      .button {
          display: inline-block;
          padding: 0.75rem 1.5rem;
          background-color: #facc15; /* Yellow background */
          color: #000; /* Black text */
          text-decoration: none;
          border-radius: 12px;
          font-size: 0.875rem;
          font-weight: bold;
          cursor: pointer;
          border: none; /* Remove any borders */
          outline: none; /* Prevent focus outline */
      }

      .text-primary {
          color: #facc15;
      }
      .font-bold {
          font-weight: bold;
      }
  </style>
</head>
<body>
<div class="card">
  <!-- Icon -->
  <div class="icon">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="m15 9-6 6m0-6 6 6m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
    </svg>
  </div>

  <!-- Title -->
  <h1 class="title">This Website is Blocked</h1>

  <!-- Dynamic Site Name -->
  <p class="description">
    You cannot access <span id="site-name" class="font-bold text-primary"></span> due to restrictions.
  </p>

  <!-- Back Button -->
  <button id="back-button" class="button" onclick="goBack()">Back</button>
</div>

<!-- Link external JavaScript -->
<script src="blocked.js"></script>
</body>
</html>
